name: Build & Deploy (Full Stack)

on:
  push:
    branches: [ "master" ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: './infra'
  ECR_REPO_NAME: 'fraud-detection-system'

jobs:
  terraform-ecr:
    name: "📦 Setup ECR Repositories"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply (ECR Only)
        run: terraform apply -auto-approve -input=false -target=aws_ecr_repository.repo
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_embedding_provider: ${{ secrets.EMBEDDING_PROVIDER }}
          TF_VAR_llm_provider: ${{ secrets.LLM_PROVIDER }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_langsmith_api_key: ${{ secrets.LANGSMITH_API_KEY }}
          TF_VAR_langsmith_project: ${{ secrets.LANGSMITH_PROJECT }}
          TF_VAR_langchain_tracing_v2: ${{ secrets.LANGCHAIN_TRACING_V2 }}

  build-backend:
    name: "🔨 Build Backend Image"
    runs-on: ubuntu-latest
    needs: terraform-ecr
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          REPO_NAME=${{ env.ECR_REPO_NAME }}
          
          echo "Construyendo imagen backend..."
          docker build -t $ECR_REGISTRY/$REPO_NAME:latest -f src/backend/Dockerfile .
          
          echo "Subiendo imagen backend..."
          docker push $ECR_REGISTRY/$REPO_NAME:latest

  deploy-infrastructure:
    name: "🚀 Deploy Full Infrastructure"
    runs-on: ubuntu-latest
    needs: [build-backend]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Wait for App Runner services to be ready
        run: |
          echo "🔍 Verificando estado de los servicios App Runner..."
          
          # Función para verificar el estado de un servicio
          check_service_status() {
            SERVICE_NAME=$1
            MAX_WAIT=600  # 10 minutos máximo
            ELAPSED=0
            
            # Obtener el ARN del servicio
            SERVICE_ARN=$(aws apprunner list-services \
              --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" \
              --output text 2>/dev/null)
            
            # Si el servicio no existe, retornar éxito (será creado por Terraform)
            if [ -z "$SERVICE_ARN" ]; then
              echo "ℹ️  Servicio $SERVICE_NAME no existe aún, será creado"
              return 0
            fi
            
            echo "📍 Servicio encontrado: $SERVICE_NAME"
            
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" \
                --query 'Service.Status' --output text 2>/dev/null || echo "ERROR")
              
              echo "   Estado actual: $STATUS (esperando: RUNNING)"
              
              if [ "$STATUS" = "RUNNING" ]; then
                echo "✅ Servicio $SERVICE_NAME está listo"
                return 0
              fi
              
              if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ]; then
                echo "❌ Servicio $SERVICE_NAME en estado de error: $STATUS"
                return 1
              fi
              
              echo "⏳ Esperando 30 segundos..."
              sleep 30
              ELAPSED=$((ELAPSED + 30))
            done
            
            echo "❌ Timeout esperando que $SERVICE_NAME esté listo"
            return 1
          }
          
          # Verificar backend
          echo ""
          echo "=== Backend Service ==="
          check_service_status "fraud-detection-system-service-v1"
          BACKEND_STATUS=$?
          
          # Verificar si ambos están listos
          if [ $BACKEND_STATUS -eq 0 ]; then
            echo ""
            echo "✅ Backend está listo para actualizar"
            exit 0
          else
            echo ""
            echo "❌ Algunos servicios no están listos"
            exit 1
          fi

      - name: Terraform Apply (Full Infra) with retry
        run: |
          for i in {1..5}; do
            echo "🚀 Intento $i de 5..."
            if terraform apply -auto-approve -input=false; then
              echo "✅ Terraform apply exitoso"
              exit 0
            fi
            
            if [ $i -lt 5 ]; then
              echo "❌ Intento $i falló, esperando 90 segundos antes del siguiente intento..."
              sleep 90
            fi
          done
          
          echo "❌ Todos los intentos de Terraform apply fallaron"
          exit 1
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_embedding_provider: ${{ secrets.EMBEDDING_PROVIDER }}
          TF_VAR_llm_provider: ${{ secrets.LLM_PROVIDER }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_langsmith_api_key: ${{ secrets.LANGSMITH_API_KEY }}
          TF_VAR_langsmith_project: ${{ secrets.LANGSMITH_PROJECT }}
          TF_VAR_langchain_tracing_v2: ${{ secrets.LANGCHAIN_TRACING_V2 }}

      - name: Display Deployment URLs
        if: success()
        run: |
          echo "🎉 Deployment completado exitosamente!"
          echo ""
          cd ${{ env.TF_WORKING_DIR }}
          echo "📍 Backend URL:"
          terraform output -raw app_url
          echo ""
